<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网易云音乐下载器</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="aura aura-1"></div>
<div class="aura aura-2"></div>

<header class="topbar" id="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.2" y="9.2" width="2.6" height="5.6" rx="1.3" fill="currentColor" opacity=".95"/>
        <rect x="7.8" y="6.4" width="2.6" height="11.2" rx="1.3" fill="currentColor"/>
        <rect x="12.4" y="8.2" width="2.6" height="7.6" rx="1.3" fill="currentColor" opacity=".95"/>
        <rect x="17" y="5.2" width="2.6" height="13.6" rx="1.3" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>网易云音乐下载器</h1>
      <p id="status" class="status"><span class="dot"></span><span id="statusText">匿名模式</span></p>
    </div>
  </div>

  <div class="top-actions">
    <button class="btn ghost" id="btnDir" title="打开保存目录">
      <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.4l1.8 2h7.8a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
      打开目录
    </button>
    <button class="btn ghost" id="btnSettings" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 4.2v1.9M12 17.9v1.9M4.2 12h1.9M17.9 12h1.9M6.6 6.6l1.4 1.4M16 16l1.4 1.4M17.4 6.6 16 8M8 16l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      设置
    </button>
    <div class="win-ctrls">
      <button class="win-btn" id="btnMin" title="最小化">
        <svg viewBox="0 0 24 24"><path d="M6 12.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 输入卡片 -->
  <section class="card input-card">
    <div class="card-head">
      <span class="head-label">
        <svg viewBox="0 0 24 24"><path d="M10 15.5V5.8l8-1.8v9.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.2" fill="currentColor"/><circle cx="16" cy="14" r="2.2" fill="currentColor"/></svg>
        解析来源
      </span>
      <span class="hint">歌单 / 专辑 / 歌手 / 单曲链接或 ID，每行一个；也可以直接输入关键词搜索</span>
    </div>
    <textarea id="input" spellcheck="false" placeholder="https://music.163.com/playlist?id=3778678&#10;周杰伦 稻香">https://music.163.com/playlist?id=3778678</textarea>
    <div class="input-bar">
      <button class="btn primary" id="btnParse">
        <svg viewBox="0 0 24 24"><path d="M11 4.2a6.8 6.8 0 1 1 0 13.6 6.8 6.8 0 0 1 0-13.6z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>解析 / 搜索</span>
      </button>

      <div class="segmented" id="levelSeg" title="音质（无损 / Hi-Res 需要会员 Cookie）">
        <button data-level="standard">标准 128k</button>
        <button data-level="higher">较高 192k</button>
        <button data-level="exhigh" class="on">极高 320k</button>
        <button data-level="lossless">无损 FLAC</button>
        <button data-level="hires">Hi-Res</button>
      </div>

      <label class="switch">
        <input type="checkbox" id="fallback" checked />
        <span class="track"></span>
        <span class="switch-label">音源兜底</span>
      </label>

      <div class="count" id="count">共 0 首 · 已选 0 首</div>
    </div>
  </section>

  <!-- 列表 -->
  <section class="card list-card">
    <div class="list-head">
      <span class="col-sel"></span>
      <span class="col-idx">#</span>
      <span class="col-title">歌名</span>
      <span class="col-artist">歌手</span>
      <span class="col-album">专辑</span>
      <span class="col-dur">时长</span>
      <span class="col-size">大小</span>
      <span class="col-fee">权限</span>
      <span class="col-status">状态</span>
    </div>
    <div class="list-body" id="list">
      <div class="empty" id="empty">
        <div class="empty-mark">
          <svg viewBox="0 0 24 24"><path d="M9.5 17.5V6.8l8-1.8v9.6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.4" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15.4" cy="15.4" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
        <p class="empty-title">还没有曲目</p>
        <p class="empty-sub">粘贴链接后点「解析 / 搜索」，歌单会整表列出来</p>
      </div>
    </div>
  </section>

  <!-- 操作条 -->
  <section class="actionbar" id="actionbar">
    <div class="bulk">
      <button class="chip" id="btnAll">全选</button>
      <button class="chip" id="btnNone">取消全选</button>
      <button class="chip" id="btnInvert">反选</button>
      <button class="chip" id="btnRemove">移除选中</button>
      <button class="chip" id="btnClear">清空</button>
      <button class="chip" id="btnLog">日志</button>
    </div>
    <div class="progress-wrap">
      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <span class="prog-text" id="progText">已下载 0 / 0 首</span>
      <span class="speed" id="speed"></span>
    </div>
    <div class="main-actions">
      <button class="btn stop" id="btnStop" disabled>
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        停止
      </button>
      <button class="btn start" id="btnStart">
        <svg viewBox="0 0 24 24"><path d="M12 4.5v10.2m0 0 3.8-3.8m-3.8 3.8L8.2 10.9" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17.2v.9a2.6 2.6 0 0 0 2.6 2.6h8.8a2.6 2.6 0 0 0 2.6-2.6v-.9" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
        开始下载
      </button>
    </div>
  </section>

  <!-- 日志 -->
  <section class="log-panel" id="logPanel">
    <div class="log-head">
      <span>运行日志</span>
      <button class="chip tiny" id="btnLogClear">清空</button>
      <button class="chip tiny" id="btnLogClose">收起</button>
    </div>
    <div class="log-body" id="log"></div>
  </section>
</main>

<!-- 设置抽屉 -->
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>设置</h2>
    <button class="icon-btn" id="drawerClose">
      <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="group">
      <p class="group-title">保存</p>
      <label class="field">
        <span>保存目录</span>
        <div class="inline">
          <input id="setDir" type="text" readonly />
          <button class="btn ghost sm" id="btnPick">浏览</button>
        </div>
      </label>
      <label class="field">
        <span>文件名模板</span>
        <input id="setTpl" type="text" />
        <small>可用变量：{artist} {title} {album} {index} {track} {year} {id}</small>
      </label>
      <label class="field">
        <span>下载线程数 <b id="ccVal">3</b></span>
        <input id="setThreads" type="range" min="1" max="8" value="3" />
      </label>
    </div>

    <div class="group">
      <p class="group-title">写入</p>
      <div class="toggles">
        <label class="switch"><input type="checkbox" id="setCover" checked /><span class="track"></span><span class="switch-label">写入封面</span></label>
        <label class="switch"><input type="checkbox" id="setLyric" checked /><span class="track"></span><span class="switch-label">写入歌词</span></label>
        <label class="switch"><input type="checkbox" id="setSkip" checked /><span class="track"></span><span class="switch-label">跳过已下载</span></label>
        <label class="switch"><input type="checkbox" id="setOrganize" /><span class="track"></span><span class="switch-label">按歌单建子目录</span></label>
        <label class="switch"><input type="checkbox" id="setStrictMp3" checked /><span class="track"></span><span class="switch-label">文件格式校验</span></label>
      </div>
      <p class="hint">开启后落盘会读文件头校验：选 MP3 档就要求真是 MP3，选无损 / Hi-Res 就要求真是 FLAC，不符自动换源重取。</p>
    </div>

    <div class="group">
      <p class="group-title">账号</p>
      <label class="field">
        <span>Cookie（可选）</span>
        <textarea id="setCookie" rows="3" placeholder="MUSIC_U=...&__csrf=..."></textarea>
        <div class="cookie-row">
          <button class="chip tiny" id="btnCheckCookie" type="button">检测 Cookie</button>
          <span class="cookie-state" id="cookieState"></span>
        </div>
        <small>填了用自己账号的合法权限下载（私密歌单也必须填）；留空即匿名模式。</small>
      </label>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn primary" id="btnSaveSet">保存设置</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
